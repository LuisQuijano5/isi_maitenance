name: CD Pipeline (Publish & Deploy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Build & Push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/isi-gateway:latest
            ghcr.io/${{ env.REPO_OWNER }}/isi-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Maintenance Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/maintenance/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/isi-maintenance:latest
            ghcr.io/${{ env.REPO_OWNER }}/isi-maintenance:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging VM
    needs: publish-images
    runs-on: [self-hosted, staging]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR via Podman
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate .env file
        run: |
          mkdir -p infrastructure/config
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF > infrastructure/config/.env
          REPO_OWNER=${OWNER_LC}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          ASPNETCORE_ENVIRONMENT=${{ vars.ASPNETCORE_ENVIRONMENT }}
          EOF

      - name: Deploy with Podman Compose
        run: |
          podman-compose -f infrastructure/compose/docker-compose.yml pull
          podman-compose --env-file infrastructure/config/.env -f infrastructure/compose/docker-compose.yml down
          podman-compose --env-file infrastructure/config/.env -f infrastructure/compose/docker-compose.yml up -d

      - name: Verify Deployment
        run: podman ps

  deploy-prod:
    name: Deploy to Production VM
    needs: publish-images
    runs-on: [self-hosted, production]
    if: github.event_name == 'workflow_dispatch' 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR via Podman
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate Production .env file
        run: |
          mkdir -p infrastructure/config
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF > infrastructure/config/.env
          REPO_OWNER=${OWNER_LC}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          ASPNETCORE_ENVIRONMENT=${{ vars.ASPNETCORE_ENVIRONMENT }}
          EOF

      - name: Deploy with Podman Compose
        run: |
          podman-compose -f infrastructure/compose/docker-compose.prod.yml pull
          podman-compose --env-file infrastructure/config/.env -f infrastructure/compose/docker-compose.prod.yml down
          podman-compose --env-file infrastructure/config/.env -f infrastructure/compose/docker-compose.prod.yml up -d