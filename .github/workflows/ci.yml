name: CI Pipeline

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test, Lint, and Audit .NET Code
  # -------------------------------------------------------------
  validate-dotnet:
    name: Validate .NET Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Check Formatting (Linting)
        run: dotnet format --verify-no-changes

      - name: Security Vulnerability Scan
        run: dotnet list package --vulnerable --include-transitive

      - name: Build All Projects
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  # -------------------------------------------------------------
  # JOB 2: Build Docker Images (Container Healthcheck)
  # -------------------------------------------------------------
  build-docker:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: validate-dotnet 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Gateway Docker Image
        run: docker build -t isi-gateway:ci -f ./src/gateway/Dockerfile .

      - name: Build Maintenance Backend Docker Image
        run: docker build -t isi-maintenance:ci -f ./src/maintenance/Dockerfile .