services:
  # --- INFRA ---
  postgres:
    image: docker.io/library/postgres:18
    container_name: isi-maintenance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  seq:
    image: docker.io/datalust/seq:latest
    container_name: isi-maintenance-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80" 
    volumes:
      - seq_data:/data
    networks:
      - microservices-net

  # --- MICROSERVICES ---
  api-gateway:
    image: isi-gateway:latest
    build:
      context: ../../src/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080" # Only the Gateway is exposed to the outside world
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    networks:
      - microservices-net
    depends_on:
      - maintenance-backend
    restart: unless-stopped

  maintenance-backend:
    image: isi-maintenance-service:latest
    build:
      context: ../../src/maintenance
      dockerfile: Dockerfile
    container_name: maintenance-backend
    expose:
      - "8080" # Isolated
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:80
    networks:
      - microservices-net
    depends_on:
      - postgres
      - seq
    restart: unless-stopped

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:
  seq_data: