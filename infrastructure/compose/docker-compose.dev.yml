services:

  postgres:
    image: docker.io/library/postgres:18
    container_name: isi_maitenance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  seq:
    image: docker.io/datalust/seq:latest
    container_name: isi_maitenance-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

volumes:
  postgres_data:
  seq_data: