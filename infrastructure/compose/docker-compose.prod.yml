services:
  postgres:
    image: docker.io/library/postgres:18
    container_name: isi-maintenance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  seq:
    image: docker.io/datalust/seq:latest
    container_name: isi-maintenance-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMINPASS}
    volumes:
      - seq_data_prod:/data

  api-gateway:
    image: ghcr.io/${REPO_OWNER}/isi-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080" 
    depends_on:
      - maintenance-backend

  maintenance-backend:
    image: ghcr.io/${REPO_OWNER}/isi-maintenance:latest
    container_name: maintenance-backend
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    depends_on:
      - postgres
      - seq

volumes:
  postgres_data_prod:
  seq_data_prod: